<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155eef" />
    <title>{% block title %}ADH Cruises | Plan your next cruise{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="ADH Cruises home">ADH Cruises</a>
      <nav class="navigation" aria-label="Main navigation">
        {% if current_user %}
          <span class="nav-user">Signed in as {{ current_user.display_name }}</span>
          {% if current_user.is_employee %}
            <a class="button button-light" href="/employee">Employee Portal</a>
          {% else %}
            <a class="button button-light" href="/account">Manage My Trips</a>
          {% endif %}
          <form class="inline-form" method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <button class="button button-outline" type="submit">Log Out</button>
          </form>
        {% else %}
          <a class="button button-outline" href="/login">Login</a>
          <a class="button button-outline" href="/register">Sign Up</a>
          <a class="button button-light" href="/account">Manage My Trips</a>
        {% endif %}
      </nav>
    </header>

    {% block content %}{% endblock %}
  </body>
</html>
