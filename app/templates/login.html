{% extends "base.html" %}

{% block title %}Login | ADH Cruises{% endblock %}

{% block content %}
<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-heading">
    <h1 id="login-heading" class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Access your ADH Cruises account.</p>

    {% if notice %}
      <div class="alert alert-success" role="status">{{ notice }}</div>
    {% endif %}

    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/login" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          maxlength="255"
          required
          autocomplete="email"
          value="{{ email }}"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        />
      </div>

      <button class="button button-primary button-full" type="submit">Log In</button>
    </form>

    <p class="auth-footer">
      New to ADH Cruises? <a href="/register">Create a customer account</a>
    </p>
  </section>
</main>
{% endblock %}
